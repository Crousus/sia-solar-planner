# nginx config for the production frontend container (copied to
# /etc/nginx/conf.d/default.conf by the root Dockerfile). conf.d files are
# included inside nginx's `http {}` block, so the zone/map definitions at
# the top of this file are http-level directives.
#
# TLS: this container listens on plain HTTP :80. In production it MUST sit
# behind a TLS-terminating reverse proxy / load balancer (Caddy, Traefik,
# a cloud LB, …). Auth tokens travel in headers and must never cross the
# public internet unencrypted.

# ── Rate limiting ────────────────────────────────────────────────────────────
# Keyed per client IP. NOTE: behind an upstream proxy $binary_remote_addr is
# the proxy's address, so ALL users would share one bucket. In that setup
# enable the realip module so nginx trusts the proxy's X-Forwarded-For:
#     set_real_ip_from <proxy CIDR>;
#     real_ip_header   X-Forwarded-For;
#     real_ip_recursive on;
# (only for the proxy's address range — trusting XFF from anyone lets
# clients spoof their way out of the limits).
#
# Credential-guessing endpoints (password / OTP login, password reset,
# verification and email-change flows): small budget. 10/min with a burst
# of 5 is invisible to a human typo-ing a password and kills brute force.
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=10r/m;
# Cheap auth calls the SPA makes routinely (token refresh, listing auth
# methods, OAuth2 code exchange).
limit_req_zone $binary_remote_addr zone=auth_soft:10m   rate=60r/m;
# Sign-up = POST /api/collections/users/records. GETs on the same path
# (member lookups) must not be throttled, so the key is empty for non-POST
# requests — nginx does not account requests with an empty key.
map $request_method $signup_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $signup_limit_key zone=signup:10m rate=5r/m;
# Expensive endpoints: server-side PDF rendering (CPU + up to 60 MB bodies)
# and datasheet import (outbound fetch + OCR + paid LLM call).
limit_req_zone $binary_remote_addr zone=pdf_render:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=datasheet:10m  rate=6r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in headers / error pages.
    server_tokens off;

    # 429 is the semantically correct "slow down" status (default is 503).
    limit_req_status 429;

    # ── Shared proxy settings ────────────────────────────────────────────────
    # Declared at server level so every proxied location inherits them.
    # (nginx inherits proxy_set_header only if a location defines NONE of
    # its own — keep it that way, or repeat all four in that location.)
    proxy_http_version 1.1;
    # Pass the original Host so PocketBase CORS checks match.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Security headers ─────────────────────────────────────────────────────
    # IMPORTANT nginx gotcha: `add_header` in a location block REPLACES all
    # server-level add_header directives for that location (no merging).
    # So no location below uses add_header; if one ever has to, it must
    # repeat this whole block. `always` = also on 4xx/5xx responses.
    #
    # Content-Security-Policy — what each source is for:
    #   script-src 'self'          Vite emits only external module scripts,
    #                              no inline JS, no eval (no 'unsafe-*').
    #   style-src 'unsafe-inline'  React style props are CSSOM (not
    #                              affected), but React Flow, Leaflet and
    #                              Konva inject <style> elements / style
    #                              attributes. Google Fonts CSS is external.
    #   font-src gstatic           Geist + JetBrains Mono (index.html).
    #   img-src                    data:/blob: = captured map image, PDF
    #                              blob previews, logo previews, html-to-image
    #                              SVG snapshots; tile hosts = ESRI World
    #                              Imagery + Bayern DOP/ALKIS WMS.
    #   connect-src                'self' = PocketBase REST + SSE realtime,
    #                              /pdf/; photon.komoot.io = address search;
    #                              tile hosts: the lock-map capture
    #                              (html2canvas / html-to-image) may re-fetch
    #                              tiles with CORS.
    #   object-src 'none'          no plugins.
    #   base-uri / form-action     block <base> hijacking and form exfil.
    #   frame-ancestors 'none'     clickjacking (supersedes X-Frame-Options,
    #                              which is still sent for old browsers).
    # If you add a map provider or external API, add its origin here or the
    # browser will silently block it (check the devtools console).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://server.arcgisonline.com https://services.arcgisonline.com https://geoservices.bayern.de; connect-src 'self' https://photon.komoot.io https://server.arcgisonline.com https://services.arcgisonline.com https://geoservices.bayern.de; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The app uses none of these powerful features; deny them outright so
    # an injected script / third-party frame can't prompt for them either.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # HSTS only means something over HTTPS, and this container only speaks
    # HTTP — set it on the TLS-terminating proxy instead. If that proxy is
    # guaranteed to forward HTTPS-only traffic here, you may uncomment it
    # (browsers ignore HSTS received over plain HTTP anyway). Start with a
    # short max-age; `preload` is a long-term commitment for the domain.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Never expose PocketBase admin surfaces ───────────────────────────────
    # The admin dashboard (/_/) is NOT proxied (it would otherwise just fall
    # through to the SPA's index.html) — return 404 explicitly so that stays
    # true even if someone later widens a proxy location.
    #
    # Superuser auth API: without a superuser token, every admin-only API
    # (/api/settings, /api/backups, /api/logs, collection schema edits) is
    # unusable from the internet, so blocking superuser login here removes
    # the whole admin attack surface (credential stuffing included).
    #
    # To administer PocketBase, tunnel to the backend container instead:
    #     docker compose exec backend ...                    (CLI), or
    #     temporarily publish `127.0.0.1:8090:8090` on `backend` in
    #     docker-compose.yml, then from your machine:
    #     ssh -L 8090:127.0.0.1:8090 user@server  →  http://localhost:8090/_/
    location ^~ /_/ {
        return 404;
    }
    location ^~ /api/_/ {
        return 404;
    }
    location ^~ /api/collections/_superusers/ {
        return 404;
    }

    # ── Rate-limited auth endpoints ──────────────────────────────────────────
    # Regex locations take precedence over the plain /api/ prefix below (but
    # not over the ^~ blocks above, so _superusers stays blocked).
    location ~ ^/api/collections/[^/]+/(auth-with-password|auth-with-otp|request-otp|request-password-reset|confirm-password-reset|request-verification|confirm-verification|request-email-change|confirm-email-change)$ {
        limit_req zone=auth_strict burst=5 nodelay;
        proxy_pass http://backend:8090;
    }
    location ~ ^/api/collections/[^/]+/(auth-refresh|auth-methods|auth-with-oauth2)$ {
        limit_req zone=auth_soft burst=20 nodelay;
        proxy_pass http://backend:8090;
    }
    location = /api/collections/users/records {
        # Only POST (sign-up) is counted — see $signup_limit_key.
        limit_req zone=signup burst=3 nodelay;
        proxy_pass http://backend:8090;
    }

    # Datasheet import: streams ndjson progress lines, so buffering stays off
    # (the Go handler also sends X-Accel-Buffering: no). Timeout above the
    # Go → ocr-service 120 s client timeout.
    location = /api/sp/parse-datasheet {
        limit_req zone=datasheet burst=3 nodelay;
        proxy_pass http://backend:8090;
        proxy_buffering    off;
        proxy_read_timeout 150s;
    }

    # Forward all other /api/* requests to the PocketBase backend container.
    # The service is named "backend" in docker-compose.yml.
    #
    # proxy_buffering off is required for the PocketBase realtime SSE
    # stream — nginx buffers proxied responses by default, which breaks the
    # live-sync feature. (This used to also `add_header X-Accel-Buffering
    # no`, but that header only has an effect when sent BY the upstream TO
    # nginx; adding it to the client response did nothing except silently
    # drop all the server-level security headers for /api/.)
    location /api/ {
        proxy_pass http://backend:8090;

        # nginx's 1 MB default would reject legitimate /api/sp/patch bodies:
        # locking the map adds the captured satellite image (base64 PNG,
        # several MB on hi-DPI screens) to the project doc in a single op,
        # and team-logo uploads are multipart. 25m sits just above the
        # projects.doc 20 MB maxSize; keep it in step with the body cap in
        # server/handlers/patch.go.
        client_max_body_size 25m;

        # SSE / long-poll: disable buffering so events flow through immediately.
        proxy_buffering          off;
        proxy_cache              off;

        # Keep long-lived connections alive (realtime SSE).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # PDF export goes directly to the pdf-service, bypassing PocketBase.
    # The pdf-service validates the auth token itself against the backend
    # (before reading the body). client_max_body_size must be generous —
    # the payload includes base64 images which can reach 20-30 MB; keep it
    # in sync with BODY_LIMIT in pdf-service/server.ts.
    location /pdf/ {
        limit_req zone=pdf_render burst=5 nodelay;
        proxy_pass http://pdf-service:3002/;
        client_max_body_size 60m;
        proxy_read_timeout 120s;
    }

    # SPA fallback: any path that is not a static file returns index.html
    # so React Router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
