# Production compose: builds both images and wires them together.
#
# Usage:
#   docker compose up --build        # first run
#   docker compose up -d             # subsequent starts
#   docker compose logs -f frontend  # tail logs
#
# The backend's pb_data is persisted in a named Docker volume so SQLite
# survives image rebuilds.  To wipe the database:
#   docker compose down -v

services:
  pdf-service:
    build:
      context: .
      dockerfile: pdf-service/Dockerfile
    environment:
      - POCKETBASE_URL=http://backend:8090
    restart: unless-stopped
    # Internal only — no host port exposure needed.

  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    environment:
      # Keys come from the shell or a root .env (gitignored). DEEPSEEK is
      # required for datasheet import; compose warns when it's unset.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # Optional fallback for transient DeepSeek failures; empty = disabled.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Override models here if needed:
      # - DEEPSEEK_MODEL=deepseek-flash
      # - GROQ_MODEL=llama-3.3-70b-versatile
    restart: unless-stopped
    # Internal only — no host port exposure needed.

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    volumes:
      # Named volume keeps the SQLite file and uploads across rebuilds.
      - pb_data:/app/pb_data
    environment:
      - OCR_SERVICE_URL=http://ocr-service:8001
      # New sign-ups must be approved by an admin before they can use the
      # app (see server/handlers/hooks.go). Without this, anyone who finds
      # the URL can self-register and consume PDF/OCR/LLM resources.
      - REQUIRE_APPROVAL=true
    depends_on:
      - ocr-service
      - pdf-service
    restart: unless-stopped
    # No ports exposed to the host — the frontend nginx proxies /api to here
    # (and deliberately blocks /_/ and the _superusers auth API, see
    # nginx.conf). To reach the PocketBase admin UI, temporarily add
    #   ports: ["127.0.0.1:8090:8090"]
    # (loopback only — never "8090:8090", which publishes the admin UI on
    # every interface) and open it through an SSH tunnel:
    #   ssh -L 8090:127.0.0.1:8090 user@server  →  http://localhost:8090/_/

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pb_data:
